<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>My Building Portal — Submit Response</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Barlow',sans-serif;background:#f4f5f7;color:#1a2333;min-height:100vh;}
.hdr{background:#1a3a5c;padding:14px 20px;}
.hdr-logo{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;color:#fff;line-height:1.1;}
.hdr-logo span{color:#c4a038;}
.wrap{max-width:600px;margin:30px auto;padding:0 16px;}
.card{background:#fff;border:1px solid #e2e5ea;border-radius:12px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
h2{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:#1a2333;margin-bottom:6px;}
.sub{font-size:13px;color:#7a8499;margin-bottom:20px;}
.meta{background:#f4f5f7;border-radius:8px;padding:12px 14px;margin-bottom:20px;font-size:12px;}
.meta-row{display:flex;gap:8px;padding:2px 0;}
.meta-label{color:#9aa3b2;width:100px;flex-shrink:0;}
.meta-value{color:#1a2333;font-weight:500;}
.questions{margin-bottom:20px;}
.q-title{font-size:11px;font-weight:700;color:#7a5c10;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:8px;}
.q-item{background:#fffbf0;border:1px solid #f0dfa0;border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.q-author{font-size:10px;color:#9aa3b2;margin-bottom:3px;}
.q-text{font-size:13px;color:#1a2333;}
.field label{display:block;font-size:10px;font-weight:600;color:#9aa3b2;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px;}
.field textarea{width:100%;border:1px solid #e2e5ea;border-radius:9px;padding:12px;font-family:'Barlow',sans-serif;font-size:13px;outline:none;min-height:120px;resize:vertical;}
.field textarea:focus{border-color:#c4a038;box-shadow:0 0 0 3px rgba(196,160,56,0.1);}
.submit-btn{width:100%;padding:13px;background:#1a5a9e;border:none;border-radius:10px;color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;margin-top:14px;}
.submit-btn:hover{background:#154d8a;}
.success{text-align:center;padding:20px 0;}
.suc-ring{width:60px;height:60px;background:#f0faf4;border:1px solid #a8dbb8;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:24px;}
.loading{text-align:center;padding:40px;color:#9aa3b2;}
.error{background:#fff3f0;border:1px solid #fcd4cc;border-radius:8px;padding:16px;color:#d84a30;text-align:center;}
</style>
</head>
<body>
<div class="hdr"><div class="hdr-logo">MY BUILDING<br><span>PORTAL</span></div></div>
<div class="wrap">
  <div class="card" id="main-card">
    <div class="loading">Loading...</div>
  </div>
</div>
<script>
const responseToken = window.location.pathname.split('/respond/')[1];
let appData = null;

async function loadPage() {
  try {
    const res = await fetch(`/api/respond/${responseToken}`);
    if (!res.ok) {
      const err = await res.json();
      showError(err.error || 'Invalid or expired link');
      return;
    }
    const data = await res.json();
    appData = data;
    renderForm(data);
  } catch (err) {
    showError('Failed to load page. Please try again.');
  }
}

function renderForm(data) {
  const app = data.application;
  const questions = data.questions || [];
  const card = document.getElementById('main-card');

  const qHtml = questions.map(q => `
    <div class="q-item">
      <div class="q-author">${q.memberName} ${q.type === 'addendum' ? '(additional question)' : ''}</div>
      <div class="q-text">${q.content}</div>
    </div>
  `).join('');

  card.innerHTML = `
    <h2>Response Required</h2>
    <p class="sub">The body corporate committee has requested additional information regarding your application.</p>
    <div class="meta">
      <div class="meta-row"><span class="meta-label">Building</span><span class="meta-value">${app.building}</span></div>
      <div class="meta-row"><span class="meta-label">Lot</span><span class="meta-value">${app.lot}</span></div>
      <div class="meta-row"><span class="meta-label">Application</span><span class="meta-value">${app.formLabel}</span></div>
      <div class="meta-row"><span class="meta-label">Reference</span><span class="meta-value">${app.ref}</span></div>
    </div>
    <div class="questions">
      <div class="q-title">Questions from the committee</div>
      ${qHtml}
    </div>
    <div class="field">
      <label>Your response</label>
      <textarea id="response-text" placeholder="Please address each question above in your response. The more detail you provide, the better the committee can consider your application."></textarea>
    </div>
    <button class="submit-btn" onclick="submitResponse()">Submit My Response →</button>
  `;
}

async function submitResponse() {
  const text = document.getElementById('response-text').value.trim();
  if (!text) { alert('Please enter your response.'); return; }

  const btn = document.querySelector('.submit-btn');
  btn.textContent = 'Submitting...';
  btn.disabled = true;

  try {
    const res = await fetch('/api/respond', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: responseToken, responseText: text })
    });
    const data = await res.json();
    if (data.success) {
      document.getElementById('main-card').innerHTML = `
        <div class="success">
          <div class="suc-ring">✓</div>
          <h2 style="margin-bottom:8px;">Response Submitted</h2>
          <p style="color:#5a6478;font-size:13px;line-height:1.6;">Thank you. Your response has been sent to the committee for review. You will be notified of the outcome by email.</p>
        </div>`;
    } else {
      btn.textContent = 'Submit My Response →';
      btn.disabled = false;
      alert(data.error || 'Submission failed. Please try again.');
    }
  } catch (err) {
    btn.textContent = 'Submit My Response →';
    btn.disabled = false;
    alert('Network error. Please try again.');
  }
}

function showError(msg) {
  document.getElementById('main-card').innerHTML = `<div class="error"><strong>Error:</strong> ${msg}</div>`;
}

loadPage();
</script>
</body>
</html>
